- type: colleague
  person: Otto Stern
  note: 1928–1929 汉堡分子束实验室受 Stern 鼓励与建议，提出均匀磁场掠角偏转新方法
- type: colleague
  person: Gregory Breit
  note: 合作发展 Breit–Rabi 方程（1931），预言改造 Stern–Gerlach 实验测定原子核性质
