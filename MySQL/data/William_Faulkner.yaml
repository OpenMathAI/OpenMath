relations:
- type: influence
  person: Phil Stone
  note: 早其四年的牛津才子，首位赏识者与导师，引荐 Joyce 等作家
- type: influence
  person: James Joyce
  note: 经 Stone 引荐阅读，古典素材置于现代语境的神话方法同脉
- type: colleague
  person: Sherwood Anderson
  note: 新奥尔良时期引路人，促成《士兵的报酬》《蚊群》出版
- type: colleague
  person: William Spratling
  note: 1925 年合租圣彼得街公寓，1926 年合印画册戏仿法国区文人圈
- type: colleague
  person: Ben Wasson
  note: 文学经纪人，删改《尘埃中的旗帜》以《沙托里》出版
- type: colleague
  person: Howard Hawks
  note: 好莱坞合作导演兼酒猎之友，《夜长梦多》等
- type: colleague
  person: Malcolm Cowley
  note: 《袖珍福克纳》（1946）编者，其声誉复苏的关键
- type: colleague
  person: Ernest Hemingway
  note: 同代风格对照（极简与意识流），福克纳曾改编其《有多少就有多少》
- type: colleague
  person: Albert Camus
  note: 将《修女安魂曲》改编为舞台剧并推崇福克纳的悲剧移植
- type: colleague
  person: Joseph Blotner
  note: 传记作者，手稿档案核心关联人
- type: spouse
  person: Estelle Oldham
  note: 1929 年成婚，青少年时代恋人，1972 年去世
- type: parent-child
  person: Jill Faulkner
  direction: child
  note: 1933–2008，二人唯一的共同孩子
- type: influence
  person: Flannery O'Connor
  note: 称福克纳的临在改变南方作家的写作尺度
- type: influence
  person: Gabriel García Márquez
  note: 马孔多与约克纳帕塔法同脉，拉美 Boom 渊源
- type: influence
  person: Claude Simon
  note: 法国新小说代表，作品明载承福克纳影响
- type: influence
  person: Mario Vargas Llosa
  note: 自述学生时代从约克纳帕塔法学到比课堂更多
- type: influence
  person: Cormac McCarthy
  note: 被称为福克纳的门徒，其处女作获福克纳基金会首作奖
