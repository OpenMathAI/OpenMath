  person: Marino Ghetaldi
  note: 学生，1612 年整理出版 Supplementum Apollonii Galli
  direction: student
- type: advisor-student
  person: Jean de Beaugrand
  note: 学生，1631 年将 Isagoge 译为拉丁文（库内既有 stub）
  direction: student
- type: influence
  person: René Descartes
  note: 笛卡尔《几何》建在韦达新代数之上并取消齐次性要求，自称「I began, where Vieta finished」；直接影响程度研究未明（库内既有 id=1296）
- type: controversy
  person: Christopher Clavius
  note: 格里高利历论战——1600 年小册子指责 Clavius 任意改动历法计算，Clavius 在韦达死后以 Explicatio（1603）反驳；对侧由 Clavius 批次写入，INSERT IGNORE 去重
- type: controversy
  person: Joseph Juste Scaliger
  note: 1589-1590 论战韦达胜出，1596 Scaliger 自莱顿再攻、1597 韦达终答
- type: controversy
  person: Adriaan van Roomen
  note: 1593 年 45 次方程全欧征解挑战（荷兰大使讥法国无数学家），韦达倚窗即解；1595 回应并回赠阿波罗尼奥斯问题；后成挚友、van Roomen 赴丰特奈同住一月学新代数
- type: parent-child
  person: Etienne Viète
  note: 父，Fontenay-le-Comte 律师兼 Le Busseau 公证人
  direction: parent
- type: parent-child
  person: Jeanne
  note: 长女，母 Barbe Cottereau，嫁布列塔尼议会议员 Jean Gabriau，1628 卒
  direction: child
- type: parent-child
  person: Suzanne
  note: 次女，母 Julienne Leclerc，1618-01 卒于巴黎
  direction: child
- type: collaborator
