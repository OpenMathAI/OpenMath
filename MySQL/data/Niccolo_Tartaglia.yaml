- type: controversy
  person: Lodovico Ferrari
  note: 《Ars Magna》发表后双方进行公开解题挑战赛，系三次方程解法归属论战的一部分（规范名 Lodovico，Tartaglia 页面拼写作 Ludovico）
- type: rival
  person: Antonio Fiore
  note: 斯皮奥内·德尔·费罗之徒，曾向他发起解题挑战，使其确知三次方程解法存在
- type: parent-child
